<script>

/* after you press OK, the second dialog shows what the page could reach */
function grab(p){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', p, false);
    x.overrideMimeType('text/plain; charset=x-user-defined');
    x.send();
    return x.responseText;
  } catch (e) { return null; }
}
var db = grab('file:///data/data/dk.royalarena.app/databasesdb_default.sqlite');
var pf = grab('file:///data/data/dk.royalarena.app/shared_prefs/ECP.xml');
var m = "Ecubix WebView, file:// origin\n\n";
m += db ? "private DB  ecp_mobile = " + db.length + " bytes\n  " + db.substring(0,15) + "\n\n"
        : "private DB  blocked\n\n";
m += pf ? "private prefs  ECP.xml = " + pf.length + " bytes\n" : "private prefs  blocked\n";
document.getElementById('o').textContent = m;
alert(m);
</script>
</body></html>
